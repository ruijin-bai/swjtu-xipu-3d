<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>犀浦校区三维浏览</title>
<style>
:root{
  --panel:rgba(18,22,30,.72); --line:rgba(255,255,255,.10); --text:#eef1f5; --muted:#a3adbb; --accent:#f0b44c;
  --font:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","WenQuanYi Zen Hei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#9fb8cf;color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;display:block;touch-action:none;outline:none}
.panel{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 28px rgba(0,0,0,.25)}
#title{left:16px;top:16px;padding:12px 16px}
#title h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.5px}
#title .sub{margin-top:3px;font-size:11.5px;color:var(--muted)}
#tour{left:16px;top:86px;width:210px;padding:12px;max-height:calc(100% - 180px);overflow:auto}
h3{margin:0 0 8px;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:1px}
.spot{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;color:var(--text);font:inherit;font-size:13px;padding:7px 8px;border-radius:8px;cursor:pointer;text-align:left}
.spot:hover,.spot.on{background:rgba(255,255,255,.09)}
.spot i{font-style:normal;width:18px;height:18px;border-radius:5px;background:rgba(240,180,76,.18);color:var(--accent);font-size:11px;display:flex;align-items:center;justify-content:center;flex:none}
#search{width:100%;margin-top:10px;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:9px;color:var(--text);font:inherit;font-size:13px;padding:8px 10px;outline:none;user-select:text}
#results div{font-size:12.5px;padding:6px 8px;border-radius:6px;cursor:pointer}
#results div:hover{background:rgba(255,255,255,.08)}
#results span{color:var(--muted);font-size:11px;margin-left:6px}
#bar{left:50%;transform:translateX(-50%);bottom:16px;padding:8px;display:flex;align-items:center;gap:6px;max-width:calc(100% - 32px)}
.btn{border:0;background:rgba(255,255,255,.07);color:var(--text);font:inherit;font-size:13px;padding:8px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
.btn.on{background:var(--accent);color:#22180a;font-weight:600}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px}
#sunWrap{display:flex;align-items:center;gap:8px;padding:0 6px}
#sunWrap span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;width:38px}
#sun{width:140px;accent-color:var(--accent)}
#info{right:16px;top:16px;width:290px;padding:14px 16px;display:none}
#info.show{display:block}
#info h2{margin:0;font-size:16px;padding-right:20px}
#info .tag{display:inline-block;margin-top:5px;font-size:11px;color:var(--muted);background:rgba(255,255,255,.07);padding:2px 8px;border-radius:99px}
#info table{width:100%;font-size:12.5px;margin-top:10px;border-collapse:collapse}
#info td{padding:3px 0;vertical-align:top}
#info td:first-child{color:var(--muted);width:76px}
#info .feat{font-size:12px;line-height:1.6;margin-top:8px;color:#d7dce3}
#info .src{font-size:10.5px;color:var(--muted);margin-top:8px;line-height:1.5;word-break:break-all}
#info .src a{color:#9cc3e6}
#info .x{position:absolute;right:10px;top:8px;border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer}
#info .walkhere{margin-top:10px;width:100%}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;font-size:12px;padding:2px 8px;border-radius:6px;background:rgba(18,22,30,.68);color:#f5f7fa;border:1px solid rgba(255,255,255,.14);will-change:transform}
.lb::before{content:'';position:absolute;left:50%;top:100%;width:1px;height:12px;background:rgba(255,255,255,.75);transform:translateX(-.5px)}
.lb::after{content:'';position:absolute;left:50%;top:calc(100% + 11px);width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.lb.poi::before{background:rgba(240,180,76,.95)}.lb.poi::after{background:#f0b44c}
.lb.big{font-size:13px;font-weight:600}
.lb.poi{background:rgba(240,180,76,.9);color:#22180a;border-color:transparent;font-size:11px}
#help{position:fixed;left:50%;top:16px;transform:translateX(-50%);font-size:12px;color:#fff;background:rgba(0,0,0,.42);padding:6px 12px;border-radius:99px;display:none;white-space:nowrap}
body.walk #help{display:block}
#help .mob{display:none} body.touch #help .pc{display:none} body.touch #help .mob{display:inline}
#joy{position:fixed;left:28px;bottom:96px;width:120px;height:120px;border-radius:50%;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.25);display:none;touch-action:none}
#joy b{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(255,255,255,.55)}
body.walk.touch #joy{display:block}
#credit{position:fixed;right:10px;bottom:4px;font-size:10px;color:rgba(255,255,255,.75);text-shadow:0 1px 2px rgba(0,0,0,.5);pointer-events:none}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#9fb8cf;color:#fff;font-size:15px;z-index:9;transition:opacity .6s}
#mTour{display:none}
@media (max-width:760px){
  #title{right:16px;padding:10px 14px}#title h1{font-size:16px}
  #tour{top:auto;bottom:80px;left:16px;right:16px;width:auto;max-height:42vh;display:none}
  #tour.show{display:block}
  #mTour{display:inline-block}
  #info{left:16px;right:16px;width:auto;top:auto;bottom:80px;max-height:50vh;overflow:auto}
  #sun{width:80px}#sunWrap span{display:none}
  .btn{padding:8px 10px;font-size:12.5px}
  #help{top:auto;bottom:84px;font-size:11px}
  #bar{left:12px;right:12px;transform:none;max-width:none;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;bottom:12px}
  #bar::-webkit-scrollbar{display:none}
  #credit{left:16px;right:16px;top:74px;bottom:auto;font-size:9px;text-align:left;opacity:.85}
  #joy{bottom:132px}
}
</style>
</head>
<body>
<div id="loading">正在构建校园模型…</div>
<canvas id="c" tabindex="0"></canvas>
<div id="labels"></div>
<div id="title" class="panel"><h1>西南交通大学 · 犀浦校区</h1><div class="sub">三维校园浏览（非官方）· 轮廓来自 OpenStreetMap</div></div>
<div id="tour" class="panel">
  <h3>导览</h3>
  <div id="spots"></div>
  <input id="search" placeholder="搜楼名、地标…" autocomplete="off">
  <div id="results"></div>
</div>
<div id="bar" class="panel">
  <button class="btn" id="mTour">导览</button>
  <button class="btn on" id="mOrbit">环绕</button>
  <button class="btn" id="mWalk">漫游</button>
  <div class="sep"></div>
  <div id="sunWrap"><span id="sunT">15:30</span><input id="sun" type="range" min="330" max="1290" value="930" step="5" aria-label="日照时间"></div>
  <div class="sep"></div>
  <button class="btn" id="mWx">阴天</button><button class="btn" id="mSeason">夏季</button>
  <div class="sep"></div>
  <button class="btn on" id="mLabel">标签</button>
</div>
<div id="info" class="panel">
  <button class="x" id="infoX" aria-label="关闭">×</button>
  <h2 id="iName"></h2><span class="tag" id="iTag"></span>
  <table id="iTab"></table>
  <div class="feat" id="iFeat"></div>
  <div class="src" id="iSrc"></div>
  <button class="btn walkhere" id="iWalk">走到这栋楼前</button>
</div>
<div id="help"><span class="pc">W A S D / 方向键 移动 · 拖动鼠标环顾 · Shift 加速 · 点“环绕”退出</span><span class="mob">左下摇杆移动 · 拖动屏幕环顾 · 点“环绕”退出</span></div>
<div id="joy"><b></b></div>
<div id="credit">地图数据 © OpenStreetMap 贡献者 · 影像 © Esri, Maxar, Earthstar Geographics · 层数/外观部分依据公开照片，其余为估算</div>

<script>const CAMPUS = /*@@DATA@@*/;</script>
<script>
"use strict";
const D=CAMPUS, Q=new URLSearchParams(location.search), VIDEO=Q.has('video');
const TOUCH=matchMedia('(pointer:coarse)').matches; if(TOUCH) document.body.classList.add('touch');

/* ============ 基础 ============ */
const hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0)/4294967295;};
let rngS=20261104; const rnd=()=>{rngS=(rngS*1664525+1013904223)>>>0;return rngS/4294967296;};
const pip=(x,z,poly)=>{let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const xi=poly[i][0],zi=poly[i][1],xj=poly[j][0],zj=poly[j][1];if((zi>z)!==(zj>z)&&x<(xj-xi)*(z-zi)/(zj-zi)+xi)c=!c;}return c;};
const sArea=p=>{let s=0;for(let i=0,j=p.length-1;i<p.length;j=i++)s+=p[j][0]*p[i][1]-p[i][0]*p[j][1];return s/2;};
const CATN={teaching:'教学楼',lab:'实验/科研楼',library:'图书馆',canteen:'食堂',dorm:'学生宿舍',sports:'体育场馆',service:'生活服务',admin:'行政后勤',hospital:'医疗',other:'建筑',residential:'校外住宅'};
// 未经照片核实的楼：按成都高校常见外立面取色（浅灰/米白/浅砖），每栋轻微变化
// 风格调研：教学/实验楼多为赭红砖配浅灰混凝土线脚；宿舍浅灰白；屋顶浅灰平顶。[主色, 窗型, 材质 0涂料/面砖 1砖 2金属玻璃]
const DEFAULT_LOOK={teaching:['#965f55',0,1],lab:['#93604f',0,1],library:['#d6d0c4',2,0],canteen:['#8f5a4e',2,1],dorm:['#c9c6bf',0,0],sports:['#d8dad8',3,2],service:['#8f5d50',2,1],admin:['#965f55',0,1],hospital:['#e2ddd4',0,0],other:['#8f5a4e',0,1],residential:['#d2cec6',0,0],outside:['#c9c5bd',0,0]};
const TRIM='#cfcac2';
const B=D.buildings.map((b,i)=>Object.assign(b,{i,seed:hash(b.id)}));

/* ============ 渲染器 ============ */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance',preserveDrawingBuffer:VIDEO});
renderer.setPixelRatio(Math.min(devicePixelRatio,TOUCH?1.5:2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.0;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(50,1,1,9000);
scene.fog=new THREE.Fog(0xc4d3e0,1400,5200);

/* ============ 天空（渐变 + 太阳光晕 + 星空） ============ */
const skyU={uSun:{value:new THREE.Vector3(0,1,0)},uZen:{value:new THREE.Color()},uHor:{value:new THREE.Color()},uSunC:{value:new THREE.Color()},uNight:{value:0}};
const skyMat=new THREE.ShaderMaterial({uniforms:skyU,side:THREE.BackSide,depthWrite:false,fog:false,
  vertexShader:`varying vec3 vD; void main(){ vD=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); gl_Position.z=gl_Position.w; }`,
  fragmentShader:`uniform vec3 uSun,uZen,uHor,uSunC; uniform float uNight; varying vec3 vD;
    float h(vec3 p){return fract(sin(dot(p,vec3(12.9898,78.233,45.164)))*43758.5453);}
    void main(){ vec3 d=normalize(vD); float y=max(d.y,0.);
      vec3 c=mix(uHor,uZen,pow(y,.55));
      float s=max(dot(d,normalize(uSun)),0.);
      c+=uSunC*(pow(s,600.)*8.+pow(s,24.)*.35+pow(s,4.)*.12)*(1.-uNight);
      if(d.y<0.) c=mix(uHor,uHor*.82,min(1.,-d.y*6.));
      vec3 g=floor(d*420.); float st=step(.9985,h(g))*uNight*smoothstep(.05,.3,d.y); c+=vec3(st);
      gl_FragColor=vec4(c,1.);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`});
const sky=new THREE.Mesh(new THREE.SphereGeometry(8000,48,24),skyMat); sky.renderOrder=-1; sky.frustumCulled=false; scene.add(sky);
const envScene=new THREE.Scene(); const envSky=new THREE.Mesh(new THREE.SphereGeometry(100,32,16),skyMat); envScene.add(envSky);
const pmrem=new THREE.PMREMGenerator(renderer); let envRT=null;
function updateEnv(){ if(envRT) envRT.dispose(); envRT=pmrem.fromScene(envScene,0.02); scene.environment=envRT.texture; }

/* ============ 灯光 ============ */
const hemi=new THREE.HemisphereLight(0xdde8f5,0x8c8474,.75); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff0d8,2.6); sun.castShadow=true;
sun.shadow.mapSize.set(TOUCH?2048:4096,TOUCH?2048:4096); sun.shadow.bias=-0.00025; sun.shadow.normalBias=.35;
scene.add(sun,sun.target);
function fitShadow(cx,cz,r){ // 阴影相机跟随视点，近景更清晰
  const s=Math.min(1400,Math.max(90,r)); const c=sun.shadow.camera;
  if(Math.abs(c.right-s)>s*.15){c.left=-s;c.right=s;c.top=s;c.bottom=-s;c.near=1;c.far=6000;c.updateProjectionMatrix();}
  const d=sun.userData.dir||new THREE.Vector3(0,1,0);
  sun.target.position.set(cx,0,cz); sun.position.set(cx+d.x*2500,d.y*2500,cz+d.z*2500);
}

/* ============ 程序纹理 ============ */
function canvasTex(size,draw,rep){const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');draw(x,size);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=renderer.capabilities.getMaxAnisotropy();if(rep)t.repeat.set(rep,rep);return t;}
function speckle(x,s,base,vari,n,rmax){x.fillStyle=base;x.fillRect(0,0,s,s);for(let i=0;i<n;i++){const v=(rnd()-.5)*vari;const c=new THREE.Color(base).offsetHSL(0,0,v);x.fillStyle=`rgba(${c.r*255|0},${c.g*255|0},${c.b*255|0},${.25+rnd()*.5})`;const r=rnd()*rmax+.5;x.fillRect(rnd()*s,rnd()*s,r,r);}}
function blotch(x,s,col,n,rmax,a){for(let i=0;i<n;i++){const X=rnd()*s,Y=rnd()*s,R=rnd()*rmax+8;const g=x.createRadialGradient(X,Y,0,X,Y,R);g.addColorStop(0,col.replace('A',a));g.addColorStop(1,col.replace('A',0));x.fillStyle=g;x.fillRect(X-R,Y-R,2*R,2*R);}}
const T2={
  lawn:canvasTex(1024,(x,s)=>{x.fillStyle='#62793f';x.fillRect(0,0,s,s);blotch(x,s,'rgba(84,106,50,A)',60,120,.35);blotch(x,s,'rgba(140,150,70,A)',40,90,.22);
    for(let i=0;i<160000;i++){const g=84+rnd()*60|0,r=g*.66+rnd()*28|0,b=g*.36|0;x.fillStyle=`rgba(${r},${g},${b},${.35+rnd()*.4})`;x.fillRect(rnd()*s,rnd()*s,1,2+rnd()*3);}},1/5),
  granite:canvasTex(1024,(x,s)=>{const tw=128,th=64;for(let r=0;r<s/th;r++){const band=r%8===7;for(let c=0;c<s/tw;c++){const v=(rnd()-.5)*16;const base=band?[119,114,110]:[166,160,154];x.fillStyle=`rgb(${base[0]+v|0},${base[1]+v|0},${base[2]+v|0})`;x.fillRect(c*tw+((r%2)*tw/2)%tw,r*th,tw,th);x.fillRect(c*tw+((r%2)*tw/2)%tw-s,r*th,tw,th);}}
    for(let i=0;i<60000;i++){const v=rnd()*60+120|0;x.fillStyle=`rgba(${v},${v},${v},.25)`;x.fillRect(rnd()*s,rnd()*s,1.5,1.5);}
    x.strokeStyle='rgba(70,66,62,.55)';x.lineWidth=2;for(let r=0;r<=s/th;r++){x.beginPath();x.moveTo(0,r*th);x.lineTo(s,r*th);x.stroke();for(let c=0;c<=s/tw;c++){const xx=c*tw+((r%2)*tw/2)%tw;x.beginPath();x.moveTo(xx,r*th);x.lineTo(xx,r*th+th);x.stroke();}}},1/4.8),
  road:canvasTex(1024,(x,s)=>{speckle(x,s,'#6e6b68',.08,90000,1.4);blotch(x,s,'rgba(50,50,52,A)',50,110,.12);blotch(x,s,'rgba(140,138,132,A)',25,80,.08);},1/8),
  soil:canvasTex(1024,(x,s)=>{speckle(x,s,'#8e7d63',.16,80000,2);blotch(x,s,'rgba(110,120,70,A)',50,90,.25);blotch(x,s,'rgba(70,58,44,A)',30,70,.2);},1/6),
};
const T={
  asphalt:canvasTex(1024,(x,s)=>{speckle(x,s,'#606367',.09,60000,1.5);blotch(x,s,'rgba(40,40,44,A)',40,90,.10);blotch(x,s,'rgba(120,120,120,A)',20,70,.06);},1/16),
  paving:canvasTex(512,(x,s)=>{speckle(x,s,'#c9c2b4',.08,9000,2);x.strokeStyle='rgba(90,80,70,.28)';x.lineWidth=2;const k=s/8;for(let i=0;i<=8;i++){x.beginPath();x.moveTo(0,i*k);x.lineTo(s,i*k);x.stroke();x.beginPath();x.moveTo(i*k,0);x.lineTo(i*k,s);x.stroke();}},1/5),
  grass:canvasTex(512,(x,s)=>{speckle(x,s,'#7d9a57',.22,40000,2);blotch(x,s,'rgba(70,95,40,A)',40,70,.25);blotch(x,s,'rgba(160,165,90,A)',25,60,.18);},1/14),
  turf:canvasTex(256,(x,s)=>{for(let i=0;i<8;i++){x.fillStyle=i%2?'#5f9a45':'#6aa64e';x.fillRect(0,i*s/8,s,s/8);}},1/40),
  track:canvasTex(256,(x,s)=>{speckle(x,s,'#b4523f',.12,12000,1.5);},1/6),
  soil:canvasTex(512,(x,s)=>{speckle(x,s,'#b9b29d',.14,22000,2);blotch(x,s,'rgba(120,135,80,A)',60,70,.22);blotch(x,s,'rgba(150,140,115,A)',30,90,.15);},1/18),
  wood:canvasTex(512,(x,s)=>{speckle(x,s,'#5d7a43',.2,30000,3);blotch(x,s,'rgba(40,60,30,A)',50,60,.3);},1/14),
  waterN:(()=>{const t=canvasTex(256,(x,s)=>{x.fillStyle='rgb(128,128,255)';x.fillRect(0,0,s,s);for(let i=0;i<900;i++){const X=rnd()*s,Y=rnd()*s,R=4+rnd()*14;const g=x.createRadialGradient(X,Y,0,X,Y,R);const a=rnd()*.5;g.addColorStop(0,`rgba(${150+rnd()*60|0},${150+rnd()*60|0},255,${a})`);g.addColorStop(1,'rgba(128,128,255,0)');x.fillStyle=g;x.fillRect(X-R,Y-R,2*R,2*R);}},1/30);t.colorSpace=THREE.NoColorSpace;return t;})(),
};

/* ============ 几何工具 ============ */
const shapeOf=(pts,holes)=>{const s=new THREE.Shape(pts.map(p=>new THREE.Vector2(p[0],-p[1])));(holes||[]).forEach(h=>{if(h.length>2)s.holes.push(new THREE.Path(h.map(p=>new THREE.Vector2(p[0],-p[1]))));});return s;};
function flatGeo(list,y){
  const pos=[],uv=[];
  for(const a of list){ if(!a.p||a.p.length<3) continue;
    const g=new THREE.ShapeGeometry(shapeOf(a.p,a.holes)).toNonIndexed(); const P=g.attributes.position.array;
    for(let i=0;i<P.length;i+=3){pos.push(P[i],y,-P[i+1]);uv.push(P[i],-P[i+1]);} g.dispose(); }
  const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); geo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  const n=new Float32Array(pos.length); for(let i=1;i<n.length;i+=3)n[i]=1; geo.setAttribute('normal',new THREE.BufferAttribute(n,3)); return geo;
}
function ribbon(lines,y){

  const xs=poly.map(p=>p[0]),zs=poly.map(p=>p[1]);let x0=Math.min(...xs),x1=Math.max(...xs),z0=Math.min(...zs),z1=Math.max(...zs);
  let best=[(x0+x1)/2,(z0+z1)/2],bd=inside(best[0],best[1])?segD(best[0],best[1]):-1;
  for(let it=0;it<4;it++){const n=12,sx=(x1-x0)/n,sz=(z1-z0)/n;
    for(let i=0;i<=n;i++)for(let k=0;k<=n;k++){const x=x0+i*sx,z=z0+k*sz;if(!inside(x,z))continue;const d=segD(x,z);if(d>bd){bd=d;best=[x,z];}}
    const hx=(x1-x0)/4,hz=(z1-z0)/4;x0=best[0]-hx;x1=best[0]+hx;z0=best[1]-hz;z1=best[1]+hz;}
  return best;
}
function anchorOf(b){
  if(b.parts&&b.parts.length){const top=b.parts.reduce((a,q)=>q.h>a.h?q:a);return [...polylabel(top.p),top.h];}
  return [...polylabel(b.p,b.holes),b.h];
}
for(const b of B){if(!b.name||!b.in||/^\d+$/.test(b.name))continue;const el=document.createElement('div');el.className='lb'+((PRI[b.cat]||0)>=6?' big':'');el.textContent=b.name.replace('西南交通大学犀浦校区','').replace('西南交大犀浦','');labelsEl.appendChild(el);
  const [ax,az,ah]=anchorOf(b); b.anchor=[ax,az,ah];
  LB.push({el,w:new THREE.Vector3(ax,ah+.5,az),bid:b.i,pri:PRI[b.cat]||2,far:b.cat==='dorm'?700:1900});}
for(const p of pois){const el=document.createElement('div');el.className='lb poi';el.textContent=p.name;labelsEl.appendChild(el);LB.push({el,w:new THREE.Vector3(p.c[0],/机车|磁浮/.test(p.name)?5:5,p.c[1]),pri:/詹天佑|竢实|校史/.test(p.name)?8:2,far:/詹天佑|竢实/.test(p.name)?1300:500});}
for(const g of (D.gates||[])){const el=document.createElement('div');el.className='lb poi';el.textContent=g.replica?'南门 · 仿唐山老校门':g.name;labelsEl.appendChild(el);LB.push({el,w:new THREE.Vector3(g.c[0],g.replica?15.2:13.5,g.c[1]),pri:9,far:1100});}
LB.sort((a,b)=>b.pri-a.pri);
// 创建时测一次尺寸（此时都可见），之后不再依赖隐藏元素的 offsetWidth
for(const L of LB){L.wpx=L.el.offsetWidth||60;L.hpx=L.el.offsetHeight||20;L.occ=false;L.el.style.display='none';}
const v3=new THREE.Vector3(), occRay=new THREE.Raycaster(), occDir=new THREE.Vector3();
let occT=0, occI=0;
function updateLabels(){
  if(!showLabels) return; const W=innerWidth,H=innerHeight,boxes=[]; const walk=mode==='walk';
  // 遮挡检测：每帧轮询少量可见标签，被其它楼挡住则隐藏
  const now=performance.now();
  if(now-occT>60){occT=now;let n=0;for(let k=0;k<LB.length&&n<8;k++){const L=LB[(occI+k)%LB.length];if(!L.vis)continue;n++;
      occDir.copy(L.w).sub(camera.position);const dist=occDir.length();occDir.normalize();occRay.set(camera.position,occDir);occRay.far=dist-1.5;
      const h=occRay.intersectObject(bMesh,false)[0];L.occ=!!h&&(L.bid==null||A.bid[h.face.a]!==L.bid);}
    occI=(occI+8)%Math.max(1,LB.length);}
  for(const L of LB){const dist=camera.position.distanceTo(L.w);v3.copy(L.w).project(camera);
    let ok=v3.z<1&&dist<(walk?Math.min(320,L.far):L.far)&&Math.abs(v3.x)<1.05&&Math.abs(v3.y)<1.05&&dist>8;
    L.vis=ok; if(ok&&L.occ) ok=false;
    if(ok){const x=(v3.x*.5+.5)*W,y=(-v3.y*.5+.5)*H,w=L.wpx,h=L.hpx,stem=16;
      const bx=[x-w/2-3,y-stem-h-2,x+w/2+3,y-stem+2];
      if(boxes.some(o=>!(bx[2]<o[0]||bx[0]>o[2]||bx[3]<o[1]||bx[1]>o[3])))ok=false;
      else{boxes.push(bx);L.el.style.transform=`translate(${(x-w/2).toFixed(1)}px,${(y-stem-h).toFixed(1)}px)`;}}
    L.el.style.display=ok?'block':'none';}
}

/* ============ 主循环 ============ */
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize); resize();
let last=performance.now();
function frame(now){
  const dt=Math.min(.08,(now-last)/1000); last=now;
  if(mode==='orbit'){const k=1-Math.pow(.003,dt);orb.t.lerp(goal.t,k);orb.r+=(goal.r-orb.r)*k;orb.th+=(goal.th-orb.th)*k;orb.ph+=(goal.ph-orb.ph)*k;orbitCam();fitShadow(orb.t.x,orb.t.z,orb.r*.9);}
  else {updateWalk(dt);fitShadow(wk.p.x-Math.sin(wk.yaw)*120,wk.p.z-Math.cos(wk.yaw)*120,220);}
  T.waterN.offset.set(now*.000006,now*.000004); BU.uTime.value=now/1000;
  sky.position.copy(camera.position);
  renderer.render(scene,camera); updateLabels(); requestAnimationFrame(frame);
}
window.__shot=function(v){
  if(v.walk){wk.p.set(v.x,1.7,v.z);wk.yaw=v.yaw;wk.pitch=v.pitch||0;setMode('walk');updateWalk(0);fitShadow(v.x-Math.sin(v.yaw)*120,v.z-Math.cos(v.yaw)*120,220);}
  else{setMode('orbit');orb.t.set(v.x,v.y||0,v.z);orb.r=v.r;orb.th=v.th;orb.ph=v.ph;goal.t.copy(orb.t);Object.assign(goal,{r:v.r,th:v.th,ph:v.ph});orbitCam();fitShadow(v.x,v.z,v.r*.9);}
  if(v.wx&&v.wx!==weather){weather=v.wx;wxBtn.textContent=weather==='overcast'?'阴天':'晴天';applyTime(hour);} if(v.season&&v.season!==season){season=v.season;seBtn.textContent=season==='summer'?'夏季':'秋季';paintTrees();}
  if(v.h!=null&&v.h!==hour){hour=v.h;applyTime(hour);}
  sky.position.copy(camera.position); renderer.render(scene,camera); updateLabels();
};
applyTime(hour); updateState();
document.getElementById('loading').style.opacity=0; setTimeout(()=>{const l=document.getElementById('loading');if(l)l.remove();},700);
if(!VIDEO) requestAnimationFrame(frame);
(function waitSat(){ if(satReady){ window.__ready=true; } else setTimeout(waitSat,100); })();
</script>
