<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>犀浦校区数字孪生</title>
<style>
:root{
  --bg:#0e1420; --panel:rgba(16,22,34,.78); --panel-b:rgba(255,255,255,.09);
  --text:#e9edf3; --muted:#9aa6b8; --accent:#f2b84b; --accent2:#5cc8d6;
  --font:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","WenQuanYi Zen Hei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;display:block;touch-action:none}
.panel{position:fixed;background:var(--panel);border:1px solid var(--panel-b);border-radius:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 32px rgba(0,0,0,.28)}
#title{left:16px;top:16px;padding:14px 18px;max-width:340px}
#title h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.5px}
#title .sub{margin-top:4px;font-size:12px;color:var(--muted);line-height:1.5}
#title .badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:rgba(242,184,75,.16);color:var(--accent);margin-right:6px}
#left{left:16px;top:112px;width:236px;padding:14px;max-height:calc(100% - 220px);overflow:auto}
#right{right:16px;top:16px;width:270px;padding:14px}
h3{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:1px}
.sec+.sec{margin-top:14px;padding-top:12px;border-top:1px solid var(--panel-b)}
.seg{display:flex;background:rgba(255,255,255,.06);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:12.5px;padding:6px 0;border-radius:7px;cursor:pointer}
.seg button.on{background:rgba(255,255,255,.14);color:var(--text)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 6px}
.legend label{display:flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer;padding:3px 4px;border-radius:6px;user-select:none}
.legend label:hover{background:rgba(255,255,255,.06)}
.legend input{display:none}
.legend .sw{width:11px;height:11px;border-radius:3px;flex:none}
.legend label.off{opacity:.38}
.legend .n{margin-left:auto;color:var(--muted);font-size:11px}
#search{width:100%;background:rgba(255,255,255,.07);border:1px solid var(--panel-b);border-radius:9px;color:var(--text);font:inherit;font-size:13px;padding:8px 10px;outline:none}
#search:focus{border-color:rgba(242,184,75,.5)}
#results{margin-top:4px}
#results div{font-size:12.5px;padding:5px 8px;border-radius:6px;cursor:pointer;color:var(--text)}
#results div:hover{background:rgba(255,255,255,.08)}
#results span{color:var(--muted);font-size:11px;margin-left:6px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:rgba(255,255,255,.05);border-radius:10px;padding:9px 10px}
.kpi .k{font-size:11px;color:var(--muted)}
.kpi .v{font-size:20px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:11px;font-weight:500;color:var(--muted);margin-left:2px}
.note{font-size:10.5px;color:var(--muted);margin-top:8px;line-height:1.5}
#chart{width:100%;height:84px;display:block;margin-top:2px}
#timebar{left:50%;transform:translateX(-50%);bottom:16px;width:min(560px,calc(100% - 32px));padding:10px 14px;display:flex;align-items:center;gap:12px}
#play{width:34px;height:34px;border-radius:50%;border:0;background:var(--accent);color:#1b1407;font-size:14px;cursor:pointer;flex:none}
#clock{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;width:64px;flex:none}
#period{font-size:11px;color:var(--muted);width:46px;flex:none}
#slider{flex:1;accent-color:var(--accent)}
#speed{background:rgba(255,255,255,.07);border:1px solid var(--panel-b);color:var(--text);border-radius:7px;font:inherit;font-size:12px;padding:4px}
#info{right:16px;top:auto;bottom:86px;width:270px;padding:14px;display:none}
#info.show{display:block}
#info h2{margin:0;font-size:16px}
#info .cat{font-size:12px;margin-top:3px;display:flex;align-items:center;gap:6px;color:var(--muted)}
#info table{width:100%;font-size:12.5px;margin-top:10px;border-collapse:collapse}
#info td{padding:3px 0}
#info td:last-child{text-align:right;font-variant-numeric:tabular-nums}
#info td:first-child{color:var(--muted)}
#info .x{position:absolute;right:10px;top:8px;border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer}
#occChart{width:100%;height:60px;display:block;margin-top:6px}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;font-size:12px;padding:2px 7px;border-radius:6px;background:rgba(14,20,32,.72);color:#f3f5f8;transform:translate(-50%,-100%);border:1px solid rgba(255,255,255,.12);will-change:transform}
.lb.big{font-size:13px;font-weight:600}
.lb.poi{background:rgba(242,184,75,.88);color:#20170a;border-color:transparent;font-size:11px}
.lb::after{content:"";position:absolute;left:50%;bottom:-5px;width:1px;height:5px;background:rgba(255,255,255,.5)}
.lb.poi::after{background:rgba(242,184,75,.9)}
#hint{position:fixed;left:16px;bottom:16px;font-size:11px;color:rgba(255,255,255,.55);text-shadow:0 1px 2px rgba(0,0,0,.6)}
#toggleR{display:none}
/* video mode */
body.video .panel,body.video #hint,body.video #timebar,body.video #info{display:none!important}
#cap{position:fixed;left:0;right:0;bottom:9%;text-align:center;pointer-events:none;display:none}
body.video #cap{display:block}
#cap .t{display:inline-block;font-size:34px;font-weight:700;padding:10px 26px;border-radius:14px;background:rgba(10,14,22,.62);color:#fff;letter-spacing:1px;transition:opacity .4s}
#cap .s{display:block;margin-top:10px;font-size:20px;color:rgba(255,255,255,.85);text-shadow:0 2px 6px rgba(0,0,0,.7)}
#vclock{position:fixed;right:44px;top:36px;display:none;text-align:right;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6)}
body.video #vclock{display:block}
#vclock .h{font-size:54px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
#vclock .d{font-size:16px;opacity:.85;margin-top:6px}
#vtitle{position:fixed;left:44px;top:36px;display:none;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6)}
body.video #vtitle{display:block}
#vtitle .a{font-size:30px;font-weight:700;letter-spacing:2px}
#vtitle .b{font-size:15px;opacity:.85;margin-top:6px}
#vkpi{position:fixed;right:44px;top:140px;display:none;gap:10px;flex-direction:column;align-items:flex-end}
body.video #vkpi{display:flex}
#vkpi div{background:rgba(10,14,22,.6);padding:8px 14px;border-radius:10px;color:#fff;font-size:15px;min-width:200px;display:flex;justify-content:space-between;gap:18px}
#vkpi b{font-variant-numeric:tabular-nums;font-size:19px}
@media (max-width:760px){
  #title{right:16px;max-width:none;padding:10px 14px}
  #title h1{font-size:16px}
  #left{top:auto;bottom:84px;left:16px;right:16px;width:auto;max-height:34vh;display:none}
  #left.show{display:block}
  #right{top:auto;bottom:84px;left:16px;right:16px;width:auto;display:none}
  #right.show{display:block}
  #info{left:16px;right:16px;width:auto;bottom:84px}
  #toggleR{display:flex;position:fixed;top:96px;right:16px;gap:6px}
  #toggleR button{background:var(--panel);border:1px solid var(--panel-b);color:var(--text);font:inherit;font-size:12px;padding:6px 10px;border-radius:8px}
  #hint{display:none}
  #period{display:none}
  #clock{font-size:18px;width:54px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>

<div id="title" class="panel">
  <h1>西南交通大学 · 犀浦校区</h1>
  <div class="sub"><span class="badge">非官方</span>数字孪生演示 · 建筑轮廓来自 OpenStreetMap</div>
</div>

<div id="toggleR"><button data-t="left">图层</button><button data-t="right">数据</button></div>

<div id="left" class="panel">
  <div class="sec">
    <h3>视图</h3>
    <div class="seg" id="mode">
      <button data-m="0" class="on">常规</button><button data-m="1">人流热力</button><button data-m="2">能耗</button>
    </div>
  </div>
  <div class="sec">
    <h3>建筑分类</h3>
    <div class="legend" id="legend"></div>
  </div>
  <div class="sec">
    <h3>查找</h3>
    <input id="search" placeholder="搜楼名，如 图书馆、天佑斋" autocomplete="off">
    <div id="results"></div>
  </div>
</div>

<div id="right" class="panel">
  <h3>校园运行概览 · <span style="color:var(--accent)">模拟</span></h3>
  <div class="kpis">
    <div class="kpi"><div class="k">室内人数</div><div class="v" id="k1">–</div></div>
    <div class="kpi"><div class="k">教学楼占用率</div><div class="v" id="k2">–</div></div>
    <div class="kpi"><div class="k">食堂就餐</div><div class="v" id="k3">–</div></div>
    <div class="kpi"><div class="k">实时负荷</div><div class="v" id="k4">–</div></div>
  </div>
  <div class="sec" style="margin-top:12px">
    <h3>全天负荷曲线（kW）</h3>
    <svg id="chart" viewBox="0 0 240 84" preserveAspectRatio="none"></svg>
  </div>
  <div class="note">人数与能耗均由作息模型推算，<b>不是实时数据</b>；层数为按建筑类型估算。</div>
</div>

<div id="info" class="panel">
  <button class="x" id="infoX" aria-label="关闭">×</button>
  <h2 id="iName"></h2>
  <div class="cat"><span class="sw" id="iSw" style="width:10px;height:10px;border-radius:3px;display:inline-block"></span><span id="iCat"></span></div>
  <table id="iTab"></table>
  <svg id="occChart" viewBox="0 0 240 60" preserveAspectRatio="none"></svg>
  <div class="note" id="iNote"></div>
</div>

<div id="timebar" class="panel">
  <button id="play" aria-label="播放">▶</button>
  <div id="clock">08:00</div>
  <div id="period">上午</div>
  <input id="slider" type="range" min="0" max="1440" step="1" value="480">
  <select id="speed"><option value="2">慢</option><option value="8" selected>中</option><option value="30">快</option></select>
</div>
<div id="hint">左键拖动旋转 · 右键平移 · 滚轮缩放 · 点击建筑查看详情</div>

<div id="vtitle"><div class="a">西南交通大学 · 犀浦校区</div><div class="b">数字孪生 · 一天的校园</div></div>
<div id="vclock"><div class="h" id="vh">06:00</div><div class="d" id="vd">清晨</div></div>
<div id="vkpi"><div>室内人数<b id="vk1">0</b></div><div>教学楼占用<b id="vk2">0%</b></div><div>实时负荷<b id="vk4">0</b></div></div>
<div id="cap"><span class="t" id="capT"></span><span class="s" id="capS"></span></div>

<script>/*@@THREE@@*/</script>
<script>const CAMPUS = /*@@DATA@@*/;</script>
<script>
"use strict";
const D = CAMPUS;
const Q = new URLSearchParams(location.search);
const VIDEO = Q.has('video');
if (VIDEO) document.body.classList.add('video');

/* ---------------- 分类与作息模型 ---------------- */
const CATS = {
  teaching:{n:'教学楼',c:'#6f93c9',dens:0.045,base:4,peak:14},
  lab:{n:'实验科研',c:'#9a86cf',dens:0.02,base:8,peak:25},
  library:{n:'图书馆',c:'#e0aa45',dens:0.06,base:5,peak:14},
  canteen:{n:'食堂',c:'#e47f63',dens:0.27,base:8,peak:45},
  dorm:{n:'宿舍',c:'#86b89e',dens:0.1,base:2,peak:10},
  sports:{n:'体育场馆',c:'#52b8c4',dens:0.02,base:4,peak:12},
  service:{n:'生活服务',c:'#e9c37f',dens:0.05,base:6,peak:20},
  admin:{n:'行政后勤',c:'#9eaab8',dens:0.03,base:4,peak:12},
  hospital:{n:'医疗',c:'#e59aa0',dens:0.03,base:8,peak:16},
  other:{n:'其他',c:'#c5c9cf',dens:0.01,base:3,peak:8},
  residential:{n:'校外住宅',c:'#b6bac1',dens:0.03,base:2,peak:8},
};
const CURVES = {
  teaching:[[0,.02],[7,.04],[8,.82],[11.8,.88],[12.2,.18],[13.8,.25],[14.1,.8],[17.5,.7],[18,.15],[19,.55],[21.5,.48],[22,.05],[24,.02]],
  lab:[[0,.05],[8,.3],[9,.7],[12,.6],[12.5,.3],[14,.72],[18,.6],[20,.45],[23,.2],[24,.06]],
  library:[[0,0],[7.5,0],[8,.3],[10,.85],[12,.62],[14,.75],[17,.8],[18,.48],[19,.92],[22,.82],[22.5,.04],[24,0]],
  canteen:[[0,0],[6.4,.04],[7.3,.86],[8.3,.18],[11,.1],[11.9,.96],[12.8,.6],[13.4,.1],[17,.1],[17.9,.9],[18.9,.48],[19.6,.1],[21,.16],[22,.02],[24,0]],
  dorm:[[0,.95],[6.5,.9],[7.5,.45],[8.5,.15],[12,.3],[13.5,.36],[14.5,.15],[17,.2],[18.5,.42],[21,.72],[23,.95],[24,.95]],
  sports:[[0,0],[6.5,.08],[7.5,.2],[9,.3],[12,.15],[16,.5],[18.5,.85],[21,.7],[22,.08],[24,0]],
  service:[[0,0],[8,.3],[12,.72],[18,.82],[22,.5],[23,.04],[24,0]],
  admin:[[0,0],[8,.1],[8.5,.8],[12,.7],[12.5,.2],[14.5,.76],[17.5,.6],[18,.05],[24,0]],
  hospital:[[0,.1],[8,.6],[12,.5],[14,.6],[17.5,.5],[18,.2],[24,.1]],
  other:[[0,.05],[8,.4],[18,.4],[20,.2],[24,.05]],
  residential:[[0,.9],[7,.85],[8.5,.35],[17,.35],[19,.75],[22,.9],[24,.9]],
};
const curveAt = (k,h)=>{const c=CURVES[k];for(let i=1;i<c.length;i++){if(h<=c[i][0]){const a=c[i-1],b=c[i];return a[1]+(b[1]-a[1])*(h-a[0])/(b[0]-a[0]);}}return c[c.length-1][1];};
const hash = s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0)/4294967295;};
const B = D.buildings.map((b,i)=>{
  const cat = b.in ? b.cat : (b.cat==='residential'||b.cat==='dorm'?'residential':'other');
  const gfa = b.area*b.levels;
  return Object.assign(b,{i,cat2:cat,gfa,cap:Math.round(gfa*CATS[cat].dens),seed:hash(b.id),label:b.name||null});
});
function occOf(b,h){
  const v = curveAt(b.cat2,h) + 0.07*Math.sin(h*1.7+b.seed*40) * (curveAt(b.cat2,h)>0.03?1:0);
  return Math.max(0,Math.min(1,v));
}
function nightOf(h){ // 0 白天 → 1 夜晚
  const s = Math.sin((h-6.2)/12*Math.PI);
  return Math.max(0,Math.min(1,(0.18-s)/0.36));
}
function loadOf(b,h){ // kW
  const c=CATS[b.cat2], o=occOf(b,h), n=nightOf(h);
  return b.gfa*(c.base + c.peak*o + 4*n*o)/1000;
}

/* ---------------- 渲染器与场景 ---------------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:VIDEO});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, VIDEO?1:2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xc9d8e6, 1800, 5200);
const camera = new THREE.PerspectiveCamera(42, 1, 2, 12000);

const hemi = new THREE.HemisphereLight(0xdfeeff, 0x8a8170, 0.9); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1dc, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(4096,4096);
Object.assign(sun.shadow.camera,{left:-1150,right:1150,top:1150,bottom:-1150,near:10,far:5000});
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.6;
scene.add(sun, sun.target);
const moon = new THREE.DirectionalLight(0x8fa8ff, 0.0); moon.position.set(-800,1200,600); scene.add(moon);

/* ---------------- 几何工具 ---------------- */
const shapeOf = (pts,holes)=>{
  const s = new THREE.Shape(pts.map(p=>new THREE.Vector2(p[0],-p[1])));
  (holes||[]).forEach(h=>{ if(h.length>2) s.holes.push(new THREE.Path(h.map(p=>new THREE.Vector2(p[0],-p[1])))); });
  return s;
};
function mergeFlat(list,y){ // list of {p,holes} -> one geometry on ground
  const pos=[];
  for(const a of list){
    if(!a.p||a.p.length<3) continue;
    let g = new THREE.ShapeGeometry(shapeOf(a.p,a.holes)); g.rotateX(-Math.PI/2); g = g.toNonIndexed();
    const arr=g.attributes.position.array; for(let i=0;i<arr.length;i+=3){pos.push(arr[i],y,arr[i+2]);}
    g.dispose();
  }
  const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  const n=new Float32Array(pos.length); for(let i=1;i<n.length;i+=3)n[i]=1; geo.setAttribute('normal',new THREE.BufferAttribute(n,3));
  return geo;
}
function ribbon(lines,y){
  const pos=[];
  for(const L of lines){
    const p=L.p, w=L.w/2; if(p.length<2) continue;
    const left=[],right=[];
    for(let i=0;i<p.length;i++){
      const a=p[Math.max(0,i-1)], b=p[Math.min(p.length-1,i+1)];
      let dx=b[0]-a[0], dz=b[1]-a[1]; const l=Math.hypot(dx,dz)||1; dx/=l; dz/=l;
      left.push([p[i][0]-dz*w,p[i][1]+dx*w]); right.push([p[i][0]+dz*w,p[i][1]-dx*w]);
    }
    for(let i=0;i<p.length-1;i++){
      const A=left[i],Bb=right[i],C=left[i+1],E=right[i+1];
      pos.push(A[0],y,A[1], C[0],y,C[1], Bb[0],y,Bb[1],  Bb[0],y,Bb[1], C[0],y,C[1], E[0],y,E[1]);
    }
  }
  const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  const n=new Float32Array(pos.length); for(let i=1;i<n.length;i+=3)n[i]=1; geo.setAttribute('normal',new THREE.BufferAttribute(n,3));
  return geo;
}
const pip=(x,z,poly)=>{let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const xi=poly[i][0],zi=poly[i][1],xj=poly[j][0],zj=poly[j][1];if((zi>z)!==(zj>z)&&x<(xj-xi)*(z-zi)/(zj-zi)+xi)c=!c;}return c;};
const polyArea=p=>{let s=0;for(let i=0,j=p.length-1;i<p.length;j=i++)s+=p[j][0]*p[i][1]-p[i][0]*p[j][1];return Math.abs(s)/2;};
let rngS=12345; const rnd=()=>{rngS=(rngS*1664525+1013904223)>>>0;return rngS/4294967296;};

/* ---------------- 地面 ---------------- */
const groundMats=[];
function flatMat(color,opts={}){
  const m=new THREE.MeshStandardMaterial(Object.assign({color,roughness:.95,metalness:0,polygonOffset:true,polygonOffsetFactor:-1,polygonOffsetUnits:-(opts.lift||1)},opts.m||{}));
  groundMats.push(m); return m;
}
const outside=new THREE.Mesh(new THREE.PlaneGeometry(14000,14000).rotateX(-Math.PI/2), new THREE.MeshStandardMaterial({color:0xd3cfc4,roughness:1}));
outside.receiveShadow=true; scene.add(outside);
const campusGround=new THREE.Mesh(mergeFlat([{p:D.boundary}],0.02), flatMat(0xe8e4da,{lift:1}));
campusGround.receiveShadow=true; scene.add(campusGround);
const AREA_STYLE={stadium:[0xa6c98f,.03,2],grass:[0xb5d197,.05,3],scrub:[0xa3c48a,.06,4],wood:[0x8bb478,.07,5],parking:[0xcfcac0,.08,6],water:[0x5f9fd6,.09,7],pitch:[0x79ad65,.10,8],track:[0xbf614a,.12,9]};
const areaMeshes={};
for(const k in AREA_STYLE){
  const list=D.areas.filter(a=>a.k===k); if(!list.length) continue;
  const [c,y,lift]=AREA_STYLE[k];
  const mat=flatMat(c,{lift,m:k==='water'?{roughness:.15,metalness:.1}:{}});
  const m=new THREE.Mesh(mergeFlat(list,y),mat); m.receiveShadow=true; scene.add(m); areaMeshes[k]=m;
}
// 球场白线

{
